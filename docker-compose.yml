# Local stack: the app + DynamoDB Local.
# The AWS credentials here are dummy values accepted by DynamoDB Local. They are not secrets.

x-local-aws: &local-aws
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: local
  AWS_SECRET_ACCESS_KEY: local
  DYNAMODB_TABLE_NAME: compie-app-local
  DYNAMODB_ENDPOINT_URL: http://dynamodb-local:8000

services:
  dynamodb-local:
    image: amazon/dynamodb-local:3.3.2

  # One-shot job that creates the table (in AWS, Terraform does this).
  dynamodb-init:
    image: amazon/aws-cli:2.38.1
    depends_on: [dynamodb-local]
    environment: *local-aws
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until aws dynamodb list-tables --endpoint-url $$DYNAMODB_ENDPOINT_URL >/dev/null 2>&1; do sleep 1; done
        aws dynamodb describe-table --table-name $$DYNAMODB_TABLE_NAME --endpoint-url $$DYNAMODB_ENDPOINT_URL >/dev/null 2>&1 ||
        aws dynamodb create-table --table-name $$DYNAMODB_TABLE_NAME --endpoint-url $$DYNAMODB_ENDPOINT_URL \
          --attribute-definitions AttributeName=pk,AttributeType=S \
          --key-schema AttributeName=pk,KeyType=HASH \
          --billing-mode PAY_PER_REQUEST >/dev/null
        echo "Table $$DYNAMODB_TABLE_NAME is ready"

  app:
    build: ./app
    image: compie-app:local
    ports: ["8000:8000"]
    environment:
      <<: *local-aws
      WELCOME_MESSAGE: Hello from the Compie DevOps assignment (local)
    depends_on:
      dynamodb-init:
        condition: service_completed_successfully
